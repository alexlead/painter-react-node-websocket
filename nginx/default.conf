server {
    listen 80;

    # 1. Фронтенд (React/Vite)
    location / {
        proxy_pass http://frontend:5173;
        
        # Настройки для WebSockets (Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Бэкенд (Node.js API)
    # Все запросы, начинающиеся с /api, пойдут на сервер
    location /api {
        proxy_pass http://backend:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Если ваш бэкенд не ожидает префикс /api в путях, 
        # раскомментируйте строку ниже (она удалит /api перед отправкой в Node):
        # rewrite ^/api/(.*) /$1 break;
    }
}